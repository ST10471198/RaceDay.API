name: RaceDay CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        # Changed from 8.0.x to 10.0.x to match your project
        dotnet-version: '10.0.x' 

    - name: Restore Dependencies
      # Restores packages for the entire solution
      run: dotnet restore RaceDay.API.sln

    - name: Build Solution
      # Builds both the API and the MVC project in Release mode
      run: dotnet build RaceDay.API.sln --no-restore --configuration Release

    - name: Run Unit Tests
      # Runs the tests in the RaceDay.Tests project
      run: dotnet test RaceDay.API.sln --no-build --configuration Release --verbosity normal
