name: RaceDay CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Restore Dependencies
      # Finds ALL .csproj files anywhere in the repo and restores them
      run: |
        find . -name "*.csproj" -exec dotnet restore {} \;

    - name: Build Projects
      # Finds ALL .csproj files and builds them
      run: |
        find . -name "*.csproj" -exec dotnet build {} --no-restore --configuration Release \;

    - name: Run Unit Tests
      # Finds the test project and runs the tests
      run: |
        find . -name "*Tests.csproj" -exec dotnet test {} --no-build --configuration Release --verbosity normal \;
