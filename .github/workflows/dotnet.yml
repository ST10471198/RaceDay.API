name: RaceDay CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Restore Dependencies
      run: |
        dotnet restore RaceDay.API.csproj
        dotnet restore RaceDay.MVC/RaceDay.MVC.csproj
        dotnet restore RaceDay.Tests/RaceDay.Tests.csproj

    - name: Build Projects
      run: |
        dotnet build RaceDay.API.csproj --no-restore --configuration Release
        dotnet build RaceDay.MVC/RaceDay.MVC.csproj --no-restore --configuration Release
        dotnet build RaceDay.Tests/RaceDay.Tests.csproj --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --no-build --configuration Release --verbosity normal
